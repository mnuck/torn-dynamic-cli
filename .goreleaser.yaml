version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: torn
    main: ./cmd/torn
    binary: torn

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

    ignore:
      - goos: windows
        goarch: arm64

    env:
      - CGO_ENABLED=0

    flags:
      - -a
      - -installsuffix=cgo

    ldflags:
      - -s -w
      - -extldflags "-static"

archives:
  - id: torn
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999

release:
  github:
    owner: mnuck
    name: torn-dynamic-cli
  draft: false
  header: |
    ## torn {{ .Tag }}
  footer: |
    **Full Changelog**: https://github.com/mnuck/torn-dynamic-cli/compare/{{ .PreviousTag }}...{{ .Tag }}
