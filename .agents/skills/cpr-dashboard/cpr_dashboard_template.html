<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OC Checkpoint Pass Rates</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root { --bg:#1a1a2e; --panel:#16213e; --ink:#e0e0e0; --muted:#888; --border:#0f3460; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
  header { padding:24px 28px 8px; text-align:center; }
  h1 { margin:0; font-size:28px; font-weight:bold; }
  .sub { color:var(--muted); font-size:14px; margin-top:8px; }
  .controls { display:flex; justify-content:center; gap:18px; align-items:center;
              flex-wrap:wrap; margin-top:14px; }
  .controls label { font-size:13px; color:var(--muted); }
  .controls select { background:var(--panel); color:var(--ink); border:1px solid var(--border);
              border-radius:6px; padding:6px 10px; font-size:14px; font-family:inherit; }
  .cf-dd { position:relative; display:inline-block; text-align:left; }
  .cf-toggle { background:var(--panel); color:var(--ink); border:1px solid var(--border);
              border-radius:6px; padding:6px 10px; font-size:14px; font-family:inherit;
              cursor:pointer; min-width:140px; display:inline-flex; justify-content:space-between;
              align-items:center; gap:8px; }
  .cf-toggle:hover { border-color:#48dbfb; }
  .cf-toggle .caret { color:var(--muted); font-size:10px; }
  .cf-panel { display:none; position:absolute; z-index:1100; top:calc(100% + 4px); left:0;
              width:320px; max-height:340px; overflow-y:auto; padding:10px 12px;
              background:var(--panel); border:1px solid var(--border); border-radius:8px;
              box-shadow:0 8px 24px rgba(0,0,0,0.5); }
  .cf-dd.open .cf-panel { display:block; }
  .cf-head { display:flex; gap:8px; padding-bottom:8px; margin-bottom:8px;
              border-bottom:1px solid var(--border); }
  .cf-head button { flex:1; background:var(--bg); color:var(--ink); border:1px solid var(--border);
              border-radius:5px; padding:4px 0; font-size:12px; cursor:pointer; font-family:inherit; }
  .cf-head button:hover { border-color:#48dbfb; }
  .cf-list { display:flex; flex-direction:column; gap:5px; }
  .cf-list label { font-size:13px; color:var(--ink); display:flex; align-items:center;
              gap:8px; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr));
          gap:30px; padding:18px 28px 40px; max-width:1600px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px;
          padding:20px 20px 12px; }
  .card h2 { margin:0 0 2px; font-size:18px; font-weight:bold; text-align:center; }
  .card .meta { color:var(--muted); font-size:12px; margin-bottom:6px; text-align:center; }
  .legend { display:flex; flex-wrap:wrap; justify-content:center; gap:8px 16px; margin:8px 0 4px; font-size:13px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .axis text { fill:var(--muted); font-size:11px; }
  .axis path, .axis line { stroke:#333; }
  .gridline line { stroke:#222; stroke-opacity:0.7; stroke-dasharray:2,3; }
  .gridline path { stroke-width:0; }
  .tip { position:fixed; pointer-events:none; background:rgba(22,33,62,0.95); border:1px solid var(--border);
         border-radius:6px; padding:10px; font-size:12px; line-height:1.6; color:var(--ink);
         white-space:nowrap; opacity:0; transition:opacity .1s; z-index:1000; }
  .empty { text-align:center; color:var(--muted); padding:60px 0; font-size:16px; }
</style>
</head>
<body>
<header>
  <h1>Checkpoint Pass Rate by Crime</h1>
  <div class="sub">One chart per organized crime (completed only). Each role has its own color &amp; shape. Faded marks = failed crimes. Click a point to open the crime.</div>
  <div class="controls">
    <label>Member <select id="memberSel"></select></label>
    <label>Crimes
      <span class="cf-dd" id="cfDd">
        <button type="button" class="cf-toggle" id="cfToggle">
          <span id="cfLabel">All crimes</span><span class="caret">▼</span>
        </button>
        <div class="cf-panel">
          <div class="cf-head">
            <button type="button" id="cfAll">All</button>
            <button type="button" id="cfNone">None</button>
          </div>
          <div class="cf-list" id="cfList"></div>
        </div>
      </span>
    </label>
  </div>
</header>
<div class="grid" id="grid"></div>
<div class="tip" id="tip"></div>
<script>
const BY_MEMBER = __BY_MEMBER__;
const DEFAULT_MEMBER = "TheKillingJoke";

const PALETTE = ["#50c878","#bb77dd","#ff9f43","#48dbfb","#ff6b6b","#1dd1a1"];
const color = d3.scaleOrdinal(PALETTE);
const SYMBOLS = [d3.symbolTriangle,d3.symbolCross,d3.symbolCircle,d3.symbolDiamond,
                 d3.symbolSquare,d3.symbolStar,d3.symbolWye];
const shape = d3.scaleOrdinal(SYMBOLS);
const tip = d3.select("#tip");

// ---- member dropdown ----
const members = Object.keys(BY_MEMBER).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
const sel = d3.select("#memberSel");
sel.selectAll("option").data(members).join("option")
   .attr("value",d=>d).text(d=>`${d} (${BY_MEMBER[d].length})`);
sel.on("change", render);

// ---- crime-name checkbox filter (global list, ordered by difficulty desc then name) ----
const crimeMeta = new Map();
for (const rows of Object.values(BY_MEMBER))
  for (const r of rows) if (!crimeMeta.has(r.name)) crimeMeta.set(r.name, r.difficulty);
const crimeNames = [...crimeMeta.keys()].sort((a,b)=>
  d3.descending(crimeMeta.get(a),crimeMeta.get(b)) || d3.ascending(a,b));

const cfList = d3.select("#cfList");
cfList.selectAll("label").data(crimeNames).join("label").html(d=>
  `<input type="checkbox" value="${d}" checked> ${d} (${crimeMeta.get(d)})`);
cfList.selectAll("input").on("change", render);
d3.select("#cfAll").on("click", ()=>{ cfList.selectAll("input").property("checked",true); render(); });
d3.select("#cfNone").on("click", ()=>{ cfList.selectAll("input").property("checked",false); render(); });

// dropdown open/close
const cfDd = d3.select("#cfDd");
d3.select("#cfToggle").on("click", (e)=>{ e.stopPropagation(); cfDd.classed("open", !cfDd.classed("open")); });
d3.select(".cf-panel").on("click", (e)=> e.stopPropagation());  // keep open while interacting
document.addEventListener("click", ()=> cfDd.classed("open", false));

function updateCfLabel() {
  const n = selectedCrimes().size, total = crimeNames.length;
  d3.select("#cfLabel").text(n===total ? "All crimes" : n===0 ? "No crimes" : `${n} of ${total}`);
}

function selectedCrimes() {
  const set = new Set();
  cfList.selectAll("input").each(function(){ if (this.checked) set.add(this.value); });
  return set;
}

// ---- URL state sync ----
function applyStateFromURL() {
  const p = new URLSearchParams(location.search);
  const m = p.get("member");
  sel.property("value", (m && BY_MEMBER[m]) ? m
                        : (BY_MEMBER[DEFAULT_MEMBER] ? DEFAULT_MEMBER : members[0]));
  const cr = p.get("crimes");
  if (cr === "none") {
    cfList.selectAll("input").property("checked", false);
  } else if (cr) {
    const want = new Set(cr.split(","));
    cfList.selectAll("input").property("checked", function(){ return want.has(this.value); });
  } else {
    cfList.selectAll("input").property("checked", true);  // default: all
  }
}

function writeStateToURL() {
  const p = new URLSearchParams();
  p.set("member", sel.property("value"));
  const sc = selectedCrimes();
  if (sc.size === 0) p.set("crimes", "none");
  else if (sc.size < crimeNames.length) p.set("crimes", [...sc].join(","));
  // all selected -> omit (default)
  history.replaceState(null, "", location.pathname + "?" + p.toString());
}
window.addEventListener("popstate", ()=>{ applyStateFromURL(); render(); });

const M = {t:10, r:14, b:24, l:38}, W = 380-28, H = 190;
const iw = W-M.l-M.r, ih = H-M.t-M.b;

function render() {
  const member = sel.property("value");
  const allow = selectedCrimes();
  updateCfLabel();
  writeStateToURL();
  const grid = d3.select("#grid").html("");
  const DATA = (BY_MEMBER[member]||[]).map(d=>({...d, date:new Date(d.t*1000)}))
                                      .filter(d=>allow.has(d.name));
  if (!DATA.length) {
    grid.append("div").attr("class","empty")
        .text("No completed OCs match the current member and crime filters.");
    return;
  }

  const byCrime = d3.groups(DATA, d => d.name)
    .sort((a,b) =>
      d3.descending(a[1][0].difficulty, b[1][0].difficulty) ||
      d3.ascending(d3.mean(a[1], d=>d.cpr), d3.mean(b[1], d=>d.cpr)));

  for (const [name, rows] of byCrime) {
    const diff = rows[0].difficulty;
    const roles = d3.groups(rows, d => d.role)
      .sort((a,b)=>d3.descending(a[1].length,b[1].length));

    const card = grid.append("div").attr("class","card");
    card.append("h2").text(`${name} (${diff})`);
    card.append("div").attr("class","meta")
        .text(`${rows.length} crimes · ${roles.length} role${roles.length>1?'s':''}`);

    const legend = card.append("div").attr("class","legend");
    roles.forEach(([r]) => {
      const s = legend.append("span");
      const sv = s.append("svg").attr("width",14).attr("height",14);
      sv.append("path").attr("transform","translate(7,7)").attr("fill",color(r))
        .attr("d", d3.symbol().type(shape(r)).size(60)());
      s.append("text").text(r);
    });

    const svg = card.append("svg").attr("width","100%").attr("viewBox",`0 0 ${W} ${H}`);
    const g = svg.append("g").attr("transform",`translate(${M.l},${M.t})`);

    const x = d3.scaleTime().domain(d3.extent(rows, d=>d.date)).range([0,iw]).nice();
    if (+x.domain()[0] === +x.domain()[1]) {
      const c=x.domain()[0]; x.domain([d3.timeDay.offset(c,-1), d3.timeDay.offset(c,1)]);
    }
    let [ylo,yhi] = d3.extent(rows, d=>d.cpr);
    const pad = Math.max(2, (yhi-ylo)*0.15);
    ylo = Math.max(0, Math.floor((ylo-pad)/5)*5);
    yhi = Math.min(100, Math.ceil((yhi+pad)/5)*5);
    if (ylo===yhi) { ylo=Math.max(0,ylo-5); yhi=Math.min(100,yhi+5); }
    const y = d3.scaleLinear().domain([ylo,yhi]).range([ih,0]);

    g.append("g").attr("class","gridline")
      .call(d3.axisLeft(y).ticks(4).tickSize(-iw).tickFormat(""));
    g.append("g").attr("class","axis")
      .call(d3.axisLeft(y).ticks(4).tickFormat(d=>d+"%"));
    g.append("g").attr("class","axis").attr("transform",`translate(0,${ih})`)
      .call(d3.axisBottom(x).ticks(4).tickFormat(d3.timeFormat("%b '%y")));

    for (const [role, pts] of roles) {
      const sorted = pts.slice().sort((a,b)=>a.date-b.date);
      if (sorted.length>1) {
        const xs = sorted.map(d=>+d.date), ys = sorted.map(d=>d.cpr);
        const mx = d3.mean(xs), my = d3.mean(ys);
        let num=0, den=0;
        for (let i=0;i<xs.length;i++){ num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2; }
        if (den>0) {
          const m=num/den, b=my-m*mx;
          const x0=xs[0], x1=xs[xs.length-1];
          g.append("line").attr("stroke",color(role)).attr("stroke-width",1)
            .attr("stroke-opacity",0.4).attr("stroke-dasharray","4,3")
            .attr("x1",x(new Date(x0))).attr("y1",y(m*x0+b))
            .attr("x2",x(new Date(x1))).attr("y2",y(m*x1+b));
        }
      }
      const sym = d3.symbol().type(shape(role)).size(42);
      g.selectAll(null).data(sorted).join("path")
        .attr("transform",d=>`translate(${x(d.date)},${y(d.cpr)})`)
        .attr("d", sym)
        .attr("fill",color(role))
        .attr("fill-opacity",d=> d.status==="Failure" ? 0.4 : 1)
        .style("cursor","pointer")
        .on("click",(e,d)=> window.open(`https://www.torn.com/factions.php?step=your&type=1#/tab=crimes&crimeId=${d.id}`,"_blank"))
        .on("mousemove",(e,d)=>{
          tip.html(`<b>${role}</b> — ${d.cpr}%<br>${d3.timeFormat("%b %e, %Y")(d.date)} · ${d.status}<br><span style="color:#888">click to open crime #${d.id}</span>`)
             .style("opacity",1);
          const n=tip.node(), tw=n.offsetWidth, th=n.offsetHeight, pad=12;
          let lx=e.clientX+pad, ty=e.clientY+pad;
          if (lx+tw > window.innerWidth-8)  lx = e.clientX - tw - pad;   // flip left
          if (ty+th > window.innerHeight-8) ty = e.clientY - th - pad;   // flip up
          tip.style("left",Math.max(8,lx)+"px").style("top",Math.max(8,ty)+"px");
        })
        .on("mouseleave",()=>tip.style("opacity",0));
    }
  }
}

applyStateFromURL();
render();
</script>
</body>
</html>
