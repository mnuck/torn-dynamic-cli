<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faction OC Revenue Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; padding: 20px; }
  h1 { color: #c9a227; text-align: center; margin-bottom: 8px; font-size: 1.6em; }
  .subtitle { text-align: center; color: #888; margin-bottom: 24px; font-size: 0.9em; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .panel { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 16px; }
  .panel.wide { grid-column: 1 / -1; }
  h2 { color: #c9a227; font-size: 1em; margin-bottom: 12px; }
  .chart { width: 100%; overflow: visible; }
  .axis path, .axis line { stroke: #444; }
  .axis text { fill: #aaa; font-size: 11px; }
  .grid-line { stroke: #2a2a4a; stroke-dasharray: 3,3; }
  .tooltip {
    position: absolute; background: #0f3460; border: 1px solid #c9a227;
    padding: 8px 12px; border-radius: 6px; font-size: 12px; pointer-events: none;
    opacity: 0; transition: opacity 0.15s; color: #e0e0e0; max-width: 220px;
  }
  .legend { display: flex; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 2px; }
  #bp-slider::-webkit-slider-thumb, #cnt-bp-slider::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#e0e0e0; cursor:pointer; border: 2px solid #1a1a2e; }
  #bp-slider::-moz-range-thumb, #cnt-bp-slider::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#e0e0e0; cursor:pointer; border: 2px solid #1a1a2e; }
  .deep-link { opacity: 0; float: right; color: #c9a227; text-decoration: none; font-size: 14px; line-height: 1; transition: opacity 0.15s; margin-left: 8px; }
  .panel:hover .deep-link { opacity: 0.6; }
  .deep-link:hover { opacity: 1 !important; }
  .deep-link.copied::after { content: " copied!"; font-size: 11px; color: #888; }
</style>
</head>
<body>
<h1>Faction OC Revenue Dashboard</h1>
<div class="subtitle" id="subtitle"></div>
<div class="tooltip" id="tooltip"></div>

<div class="grid">
  <div class="panel wide" id="panel-weekly"></div>
  <div class="panel wide" id="panel-count"></div>
  <div class="panel wide" id="panel-participants"></div>
  <div class="panel wide" id="panel-winrate"></div>
  <div class="panel" id="panel-diff-revenue"></div>
  <div class="panel" id="panel-diff-total"></div>
  <div class="panel wide" id="panel-diff-winrate"></div>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const tooltip = d3.select("#tooltip");
function fmt$(n) {
  if (n >= 1e9) return `$${(n/1e9).toFixed(1)}B`;
  if (n >= 1e6) return `$${(n/1e6).toFixed(1)}M`;
  if (n >= 1e3) return `$${(n/1e3).toFixed(0)}K`;
  return `$${n}`;
}

function showTip(html, event) {
  const tip = tooltip.html(html).style("opacity", 1);
  const tipW = tip.node().offsetWidth;
  const flipX = event.pageX + 14 + tipW > window.innerWidth;
  tip.style("left", (flipX ? event.pageX - tipW - 14 : event.pageX + 14) + "px")
     .style("top",  (event.pageY - 28) + "px");
}
function hideTip() { tooltip.style("opacity", 0); }

// ── Load data ──────────────────────────────────────────────────────────────
// update_data.py replaces this line with the history from BigQuery when it renders
// generated/oc_dashboard.html. This tracked file is only the template.
const data = {"weekly":[],"daily":[],"meta":{}};

const weekly = data.weekly.map(d => ({...d, date: new Date(d.week)}));
const daily  = data.daily.map(d => ({...d, date: new Date(d.date)}));
const meta = data.meta || {};
document.getElementById("subtitle").textContent =
  `${meta.date_range || ""} · ${(meta.total_crimes || 0).toLocaleString()} crimes`;

function aggregateDifficultyWeeks(weeks) {
  const totals = {};
  for (let d = 1; d <= 8; d++) {
    totals[d] = {count:0, wins:0, total:0, cost:0, person_days:0};
  }
  weeks.forEach(w => {
    for (let d = 1; d <= 8; d++) {
      const key = String(d);
      totals[d].count += w.countByDiff?.[key] || 0;
      totals[d].wins += w.winsByDiff?.[key] || 0;
      totals[d].total += w.byDiff?.[key] || 0;
      totals[d].cost += w.costByDiff?.[key] || 0;
      totals[d].person_days += w.personDaysByDiff?.[key] || 0;
    }
  });
  return totals;
}

const difficultyWindows = (() => {
  const allWeeks = aggregateDifficultyWeeks(weekly);
  const last4Weeks = aggregateDifficultyWeeks(weekly.slice(-4));
  return Array.from({length:8}, (_, i) => ({
    difficulty: i + 1,
    total: allWeeks[i + 1],
    last4: last4Weeks[i + 1],
  }));
})();
const difficultyPeriods = ["total", "last4"];
const difficultyPeriodLabels = {total: "Last 52 weeks", last4: "Last 4 weeks"};
const difficultyPeriodColors = {total:"#c9a227", last4:"#4ecdc4"};

const defaultControlState = {
  revBp: 6,
  revBand: "both",
  cntBp: 6,
  cntBand: "both",
  part: "1,2,3,4,5,6,7,8",
  avgDenom: "pd",
  avgMetric: "profit",
};

const urlParams = new URLSearchParams(location.search);
function parseBpParam(name) {
  const n = Number(urlParams.get(name));
  return Number.isInteger(n) && n >= 2 && n <= 8 ? n : defaultControlState[name];
}
function parseBandParam(name) {
  const val = urlParams.get(name);
  return ["high", "low", "both"].includes(val) ? val : defaultControlState[name];
}
function parseEnumParam(name, allowed) {
  const val = urlParams.get(name);
  return allowed.includes(val) ? val : defaultControlState[name];
}
function parsePartParam() {
  const valid = new Set(["1","2","3","4","5","6","7","8"]);
  const parts = (urlParams.get("part") || defaultControlState.part)
    .split(",")
    .filter(d => valid.has(d));
  return parts.length ? Array.from(new Set(parts)).join(",") : defaultControlState.part;
}
const controlState = {
  revBp: parseBpParam("revBp"),
  revBand: parseBandParam("revBand"),
  cntBp: parseBpParam("cntBp"),
  cntBand: parseBandParam("cntBand"),
  part: parsePartParam(),
  avgDenom: parseEnumParam("avgDenom", ["crime", "win", "pd"]),
  avgMetric: parseEnumParam("avgMetric", ["revenue", "profit"]),
};

function syncUrlState() {
  const params = new URLSearchParams(location.search);
  for (const [key, defaultValue] of Object.entries(defaultControlState)) {
    if (controlState[key] === defaultValue) params.delete(key);
    else params.set(key, controlState[key]);
  }
  const query = params.toString();
  const nextUrl = `${location.pathname}${query ? `?${query}` : ""}${location.hash}`;
  history.replaceState(null, "", nextUrl);
}

function setHash(hash) {
  const query = location.search;
  history.replaceState(null, "", `${location.pathname}${query}${hash}`);
}

syncUrlState();

// ── 1. Weekly Revenue ──────────────────────────────────────────────────────
(function() {
  const el = document.getElementById("panel-weekly");
  el.innerHTML = `<h2>Weekly OC Revenue</h2>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:4px;">
      <div class="legend" style="margin:0">
        <div class="legend-item" id="rev-li-low"  style="cursor:pointer"><div class="legend-swatch" style="background:#4a6fa5"></div><span id="lbl-low">d1–d5 (Low)</span></div>
        <div class="legend-item" id="rev-li-high" style="cursor:pointer"><div class="legend-swatch" style="background:#c9a227"></div><span id="lbl-high">d6+ (High)</span></div>
        <div class="legend-item"><div class="legend-swatch" style="background:#c0392b;opacity:0.8"></div>Cost</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;color:#888;font-size:0.8em;">
        <span>Breakpoint:</span>
        <span style="color:#4a6fa5;font-weight:bold">d1</span>
        <input id="bp-slider" type="range" min="2" max="8" value="6"
          style="width:80px;cursor:pointer;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline:none;background:linear-gradient(to right,#4a6fa5 66.7%,#c9a227 66.7%)">
        <span id="bp-label" style="color:#e0e0e0;font-weight:bold;min-width:50px;margin-left:4px">split: d6</span>
      </div>
    </div>`;

  const W = el.clientWidth - 32, H = 240;
  const margin = {top:10, right:20, bottom:40, left:70};
  const w = W - margin.left - margin.right;
  const h = H - margin.top - margin.bottom;

  const svg = d3.select(el).append("svg").attr("class","chart").attr("width",W).attr("height",H);
  const g = svg.append("g").attr("transform",`translate(${margin.left},${margin.top})`);

  const x = d3.scaleBand().domain(weekly.map(d=>d.date)).range([0,w]).padding(0.15);
  const y = d3.scaleLinear().range([h,0]);

  const gridG = g.append("g");
  const barsLow  = g.selectAll(".bar-low").data(weekly).join("rect").attr("class","bar-low").attr("fill","#4a6fa5").attr("opacity",0.85);
  const barsHigh = g.selectAll(".bar-high").data(weekly).join("rect").attr("class","bar-high").attr("fill","#c9a227").attr("opacity",0.85);

  const costBars = g.selectAll(".bar-cost").data(weekly).join("rect").attr("class","bar-cost")
    .attr("fill","#c0392b").attr("opacity",0.8).attr("pointer-events","none");


  const xTicks = weekly.filter((_,i)=>i%4===0).map(d=>d.date);
  g.append("g").attr("class","axis").attr("transform",`translate(0,${h})`)
    .call(d3.axisBottom(x).tickValues(xTicks).tickFormat(d3.timeFormat("%b '%y")));
  const yAxisG = g.append("g").attr("class","axis");

  const vis = {
    high: controlState.revBand !== "low",
    low: controlState.revBand !== "high",
  };
  let curBp = controlState.revBp;

  function bandState(v) {
    if (v.high && !v.low) return "high";
    if (v.low && !v.high) return "low";
    return "both";
  }

  function redraw(bp, v) {
    curBp = bp;
    document.getElementById("lbl-high").textContent = `d${bp}+ (High)`;
    document.getElementById("lbl-low").textContent  = `d1–d${bp-1} (Low)`;
    document.getElementById("rev-li-high").style.opacity = v.high ? 1 : 0.35;
    document.getElementById("rev-li-low").style.opacity  = v.low  ? 1 : 0.35;

    weekly.forEach(d => {
      d.high = 0; d.low = 0; d.highCost = 0; d.lowCost = 0;
      for (let i = 1; i <= 8; i++) {
        const val = d.byDiff?.[String(i)] || 0;
        const cost = d.costByDiff?.[String(i)] || 0;
        if (i >= bp) {
          d.high += val;
          d.highCost += cost;
        } else {
          d.low += val;
          d.lowCost += cost;
        }
      }
      d.visibleMoney = (v.high ? d.high : 0) + (v.low ? d.low : 0);
      d.visibleCost = (v.high ? d.highCost : 0) + (v.low ? d.lowCost : 0);
    });

    const maxVal = v.high && v.low ? d3.max(weekly, d => d.money)
                 : v.high          ? d3.max(weekly, d => d.high)
                 :                   d3.max(weekly, d => d.low);
    y.domain([0, maxVal * 1.05]);

    gridG.selectAll("line").data(y.ticks(5)).join("line")
      .attr("class","grid-line").attr("x1",0).attr("x2",w)
      .attr("y1",d=>y(d)).attr("y2",d=>y(d));
    yAxisG.call(d3.axisLeft(y).ticks(5).tickFormat(fmt$));

    costBars
      .attr("x", d => x(d.date)).attr("width", x.bandwidth())
      .attr("y", d => y(d.visibleMoney))
      .attr("height", d => Math.max(0, y(d.visibleMoney - Math.min(d.visibleCost, d.visibleMoney)) - y(d.visibleMoney)));

    const tip = (d) => `<b>${d3.timeFormat("%b %d, %Y")(d.date)}</b><br>
       Visible revenue: ${fmt$(d.visibleMoney)}<br>
       Visible cost: ${fmt$(d.visibleCost)}<br>
       Visible profit: ${fmt$(d.visibleMoney - d.visibleCost)}<br>
       d${bp}+ (High): ${fmt$(d.high)}<br>
       d1–d${bp-1} (Low): ${fmt$(d.low)}<br>
       Crimes: ${d.crimes} (${d.wins}W / ${d.fails}L)<br>
       Win rate: ${(d.wins/d.crimes*100).toFixed(0)}%`;

    // Low bar: from 0 when low only or both; hidden when high only
    barsLow
      .attr("x", d=>x(d.date)).attr("width", x.bandwidth())
      .attr("y",      d => v.low ? y(d.low) : h)
      .attr("height", d => v.low ? h - y(d.low) : 0)
      .on("mouseover", (e,d) => showTip(tip(d), e)).on("mouseout", hideTip);

    // High bar: stacked on low when both; from 0 when high only; hidden when low only
    barsHigh
      .attr("x", d=>x(d.date)).attr("width", x.bandwidth())
      .attr("y",      d => v.high ? (v.low ? y(d.money) : y(d.high)) : h)
      .attr("height", d => v.high ? (v.low ? y(d.low) - y(d.money) : h - y(d.high)) : 0)
      .on("mouseover", (e,d) => showTip(tip(d), e)).on("mouseout", hideTip);
  }

  function updateSliderColor(bp) {
    const pct = ((bp - 2) / (8 - 2) * 100).toFixed(1);
    document.getElementById("bp-slider").style.background =
      `linear-gradient(to right, #4a6fa5 ${pct}%, #c9a227 ${pct}%)`;
    document.getElementById("bp-label").textContent = `split: d${bp}`;
  }

  function toggleBand(band) {
    if (vis[band] && !vis[band === 'high' ? 'low' : 'high']) return; // keep at least one
    vis[band] = !vis[band];
    controlState.revBand = bandState(vis);
    syncUrlState();
    redraw(curBp, vis);
  }

  document.getElementById("bp-slider").value = curBp;
  redraw(curBp, vis);
  updateSliderColor(curBp);
  document.getElementById("bp-slider").addEventListener("input", e => {
    const bp = +e.target.value;
    controlState.revBp = bp;
    syncUrlState();
    redraw(bp, vis);
    updateSliderColor(bp);
  });
  document.getElementById("rev-li-high").addEventListener("click", () => toggleBand("high"));
  document.getElementById("rev-li-low").addEventListener("click",  () => toggleBand("low"));
})();

// ── 2. Weekly OC Count ────────────────────────────────────────────────────
(function() {
  const el = document.getElementById("panel-count");
  el.innerHTML = `<h2>Weekly OC Attempts</h2>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:4px;">
      <div class="legend" style="margin:0">
        <div class="legend-item" id="cnt-li-low"  style="cursor:pointer"><div class="legend-swatch" style="background:#4a6fa5"></div><span id="cnt-lbl-low">d1–d5 (Low)</span></div>
        <div class="legend-item" id="cnt-li-high" style="cursor:pointer"><div class="legend-swatch" style="background:#c9a227"></div><span id="cnt-lbl-high">d6+ (High)</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;color:#888;font-size:0.8em;">
        <span>Breakpoint:</span>
        <span style="color:#4a6fa5;font-weight:bold">d1</span>
        <input id="cnt-bp-slider" type="range" min="2" max="8" value="6"
          style="width:80px;cursor:pointer;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline:none;background:linear-gradient(to right,#4a6fa5 66.7%,#c9a227 66.7%)">
        <span id="cnt-bp-label" style="color:#e0e0e0;font-weight:bold;min-width:50px;margin-left:4px">split: d6</span>
      </div>
    </div>`;

  const W = el.clientWidth - 32, H = 240;
  const margin = {top:10, right:20, bottom:40, left:50};
  const w = W - margin.left - margin.right;
  const h = H - margin.top - margin.bottom;

  const svg = d3.select(el).append("svg").attr("class","chart").attr("width",W).attr("height",H);
  const g = svg.append("g").attr("transform",`translate(${margin.left},${margin.top})`);

  const x = d3.scaleBand().domain(weekly.map(d=>d.date)).range([0,w]).padding(0.15);
  const y = d3.scaleLinear().range([h, 0]);

  const gridG = g.append("g");
  const barsLow  = g.selectAll(".cnt-bar-low").data(weekly).join("rect").attr("class","cnt-bar-low").attr("fill","#4a6fa5").attr("opacity",0.85);
  const barsHigh = g.selectAll(".cnt-bar-high").data(weekly).join("rect").attr("class","cnt-bar-high").attr("fill","#c9a227").attr("opacity",0.85);


  const xTicks = weekly.filter((_,i)=>i%4===0).map(d=>d.date);
  g.append("g").attr("class","axis").attr("transform",`translate(0,${h})`)
    .call(d3.axisBottom(x).tickValues(xTicks).tickFormat(d3.timeFormat("%b '%y")));
  const yAxisG = g.append("g").attr("class","axis");

  const vis = {
    high: controlState.cntBand !== "low",
    low: controlState.cntBand !== "high",
  };
  let curBp = controlState.cntBp;

  function bandState(v) {
    if (v.high && !v.low) return "high";
    if (v.low && !v.high) return "low";
    return "both";
  }

  function redraw(bp, v) {
    curBp = bp;
    document.getElementById("cnt-lbl-high").textContent = `d${bp}+ (High)`;
    document.getElementById("cnt-lbl-low").textContent  = `d1–d${bp-1} (Low)`;
    document.getElementById("cnt-li-high").style.opacity = v.high ? 1 : 0.35;
    document.getElementById("cnt-li-low").style.opacity  = v.low  ? 1 : 0.35;

    weekly.forEach(d => {
      d.cntHigh = 0; d.cntLow = 0;
      for (let i = 1; i <= 8; i++) {
        const val = d.countByDiff?.[String(i)] || 0;
        if (i >= bp) d.cntHigh += val; else d.cntLow += val;
      }
    });

    const maxVal = v.high && v.low ? d3.max(weekly, d => d.crimes)
                 : v.high          ? d3.max(weekly, d => d.cntHigh)
                 :                   d3.max(weekly, d => d.cntLow);
    y.domain([0, maxVal * 1.05]);

    gridG.selectAll("line").data(y.ticks(5)).join("line")
      .attr("class","grid-line").attr("x1",0).attr("x2",w)
      .attr("y1",d=>y(d)).attr("y2",d=>y(d));
    yAxisG.call(d3.axisLeft(y).ticks(5).tickFormat(d3.format("d")));

    const tip = (d) => `<b>${d3.timeFormat("%b %d, %Y")(d.date)}</b><br>
       Total: ${d.crimes} attempts<br>
       d${bp}+ (High): ${d.cntHigh}<br>
       d1–d${bp-1} (Low): ${d.cntLow}<br>
       Win rate: ${(d.wins/d.crimes*100).toFixed(0)}%`;

    barsLow
      .attr("x", d=>x(d.date)).attr("width", x.bandwidth())
      .attr("y",      d => v.low ? y(d.cntLow) : h)
      .attr("height", d => v.low ? h - y(d.cntLow) : 0)
      .on("mouseover", (e,d) => showTip(tip(d), e)).on("mouseout", hideTip);

    barsHigh
      .attr("x", d=>x(d.date)).attr("width", x.bandwidth())
      .attr("y",      d => v.high ? (v.low ? y(d.crimes) : y(d.cntHigh)) : h)
      .attr("height", d => v.high ? (v.low ? y(d.cntLow) - y(d.crimes) : h - y(d.cntHigh)) : 0)
      .on("mouseover", (e,d) => showTip(tip(d), e)).on("mouseout", hideTip);
  }

  function updateSliderColor(bp) {
    const pct = ((bp - 2) / (8 - 2) * 100).toFixed(1);
    document.getElementById("cnt-bp-slider").style.background =
      `linear-gradient(to right, #4a6fa5 ${pct}%, #c9a227 ${pct}%)`;
    document.getElementById("cnt-bp-label").textContent = `split: d${bp}`;
  }

  function toggleBand(band) {
    if (vis[band] && !vis[band === 'high' ? 'low' : 'high']) return;
    vis[band] = !vis[band];
    controlState.cntBand = bandState(vis);
    syncUrlState();
    redraw(curBp, vis);
  }

  document.getElementById("cnt-bp-slider").value = curBp;
  redraw(curBp, vis);
  updateSliderColor(curBp);
  document.getElementById("cnt-bp-slider").addEventListener("input", e => {
    const bp = +e.target.value;
    controlState.cntBp = bp;
    syncUrlState();
    redraw(bp, vis);
    updateSliderColor(bp);
  });
  document.getElementById("cnt-li-high").addEventListener("click", () => toggleBand("high"));
  document.getElementById("cnt-li-low").addEventListener("click",  () => toggleBand("low"));
})();

// ── 3. Weekly Participants by Highest OC Level ────────────────────────────
(function() {
  const el = document.getElementById("panel-participants");

  const colorScale = d3.scaleSequential()
    .domain([1, 8])
    .interpolator(d3.interpolateTurbo);

  const diffs = ["1","2","3","4","5","6","7","8"];
  el.innerHTML = `<h2>Weekly Participants by Highest OC Level</h2>
    <div class="legend">
      ${diffs.map(d => `<div class="legend-item" id="part-li-d${d}" style="cursor:pointer">
        <div class="legend-swatch" style="background:${colorScale(+d)}"></div>d${d}
      </div>`).join("")}
    </div>`;

  const W = el.clientWidth - 32, H = 240;
  const margin = {top:10, right:20, bottom:40, left:50};
  const w = W - margin.left - margin.right;
  const h = H - margin.top - margin.bottom;

  const svg = d3.select(el).append("svg").attr("class","chart").attr("width",W).attr("height",H);
  const g = svg.append("g").attr("transform",`translate(${margin.left},${margin.top})`);

  const x = d3.scaleBand().domain(weekly.map(d=>d.date)).range([0,w]).padding(0.15);
  const y = d3.scaleLinear().range([h, 0]);
  const gridG = g.append("g");
  const barsG = g.append("g");

  const activeFromUrl = new Set(controlState.part.split(","));
  const vis = Object.fromEntries(diffs.map(d => [d, activeFromUrl.has(d)]));

  function redraw() {
    const activeDiffs = diffs.filter(d => vis[d]);
    diffs.forEach(d => {
      document.getElementById(`part-li-d${d}`).style.opacity = vis[d] ? 1 : 0.35;
    });

    const totalPerWeek = weekly.map(d => d3.sum(activeDiffs, k => d.participantsByDiff?.[k] || 0));
    y.domain([0, (d3.max(totalPerWeek) || 1) * 1.05]);

    gridG.selectAll("line").data(y.ticks(5)).join("line")
      .attr("class","grid-line").attr("x1",0).attr("x2",w)
      .attr("y1",d=>y(d)).attr("y2",d=>y(d));
    yAxisG.call(d3.axisLeft(y).ticks(5).tickFormat(d3.format("d")));

    const stack = d3.stack().keys(activeDiffs).value((d, key) => d.participantsByDiff?.[key] || 0);
    const series = stack(weekly);
    barsG.selectAll("rect").remove();

    series.forEach(layer => {
      const diff = +layer.key;
      barsG.selectAll(`.part-bar-d${diff}`).data(layer).join("rect")
        .attr("class", `part-bar-d${diff}`)
        .attr("x", d => x(d.data.date))
        .attr("width", x.bandwidth())
        .attr("y", d => y(d[1]))
        .attr("height", d => Math.max(0, y(d[0]) - y(d[1])))
        .attr("fill", colorScale(diff))
        .attr("opacity", 0.85)
        .on("mouseover", (e, d) => {
          const pd = d.data.participantsByDiff || {};
          const visibleTotal = activeDiffs.reduce((s,k) => s + (pd[k]||0), 0);
          showTip(`<b>${d3.timeFormat("%b %d, %Y")(d.data.date)}</b><br>
            Visible participants: ${visibleTotal}<br>
            ${activeDiffs.filter(k=>pd[k]).map(k=>`d${k}: ${pd[k]}`).join("<br>")}`, e);
        })
        .on("mouseout", hideTip);
    });
  }

  function toggleDiff(diff) {
    if (vis[diff] && diffs.filter(d => vis[d]).length === 1) return;
    vis[diff] = !vis[diff];
    controlState.part = diffs.filter(d => vis[d]).join(",");
    syncUrlState();
    redraw();
  }

  const xTicks = weekly.filter((_,i)=>i%4===0).map(d=>d.date);
  g.append("g").attr("class","axis").attr("transform",`translate(0,${h})`)
    .call(d3.axisBottom(x).tickValues(xTicks).tickFormat(d3.timeFormat("%b '%y")));
  const yAxisG = g.append("g").attr("class","axis");

  diffs.forEach(d => document.getElementById(`part-li-d${d}`).addEventListener("click", () => toggleDiff(d)));
  redraw();
})();

// ── 4. Rolling Win Rate ────────────────────────────────────────────────────
(function() {
  const el = document.getElementById("panel-winrate");
  el.innerHTML = `<h2>Win Rate — Rolling Average</h2>
    <div class="legend">
      <div class="legend-item"><div class="legend-swatch" style="background:#c9a227"></div>28-day</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#e87040;opacity:0.8"></div>7-day</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#4caf50;border-radius:50%"></div>a single win</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#e05555;border-radius:50%"></div>a single loss</div>
    </div>`;

  const W = el.clientWidth - 32, H = 220;
  const margin = {top:10, right:20, bottom:40, left:55};
  const w = W - margin.left - margin.right;
  const h = H - margin.top - margin.bottom;
  const msPerDay = 864e5;

  function rollingAvg(days) {
    return daily.map((d, i) => {
      const windowStart = new Date(d.date - (days - 1) * msPerDay);
      if (daily[0].date > windowStart) return { date: d.date, rate: null };
      const slice = daily.filter(s => s.date >= windowStart && s.date <= d.date);
      const wins  = d3.sum(slice, s=>s.wins);
      const total = d3.sum(slice, s=>s.crimes);
      return { date: d.date, rate: total ? wins/total : null };
    }).filter(d=>d.rate != null);
  }

  const rolling28 = rollingAvg(28);
  const rolling7  = rollingAvg(7);

  const svg = d3.select(el).append("svg")
    .attr("class","chart").attr("width",W).attr("height",H);
  const g = svg.append("g").attr("transform",`translate(${margin.left},${margin.top})`);

  const x = d3.scaleTime().domain(d3.extent(daily, d=>d.date)).range([0,w]);
  const y = d3.scaleLinear().domain([0.3, 1.0]).range([h,0]);

  // Grid
  g.append("g").selectAll("line").data(y.ticks(6)).join("line")
    .attr("class","grid-line").attr("x1",0).attr("x2",w)
    .attr("y1",d=>y(d)).attr("y2",d=>y(d));

  // 85% target line
  g.append("line").attr("stroke","#ff6b6b").attr("stroke-width",1)
    .attr("stroke-dasharray","4,4").attr("opacity",0.6)
    .attr("x1",0).attr("x2",w).attr("y1",y(0.85)).attr("y2",y(0.85));
  g.append("text").attr("fill","#ff6b6b").attr("font-size",10).attr("opacity",0.8)
    .attr("x",4).attr("y",y(0.85)-4).text("85% target");

  const line = d3.line().x(d=>x(d.date)).y(d=>y(d.rate)).curve(d3.curveMonotoneX);

  // 28-day line
  g.append("path").datum(rolling28).attr("fill","none").attr("stroke","#c9a227")
    .attr("stroke-width",2).attr("d",line);

  // 7-day line (no fill, more transparent)
  g.append("path").datum(rolling7).attr("fill","none").attr("stroke","#e87040")
    .attr("stroke-width",1.5).attr("opacity",0.3).attr("d",line);


  // Hover scrubber — window bands + dots
  const bisect = d3.bisector(d=>d.date).left;

  const band28 = g.append("rect").attr("height",h).attr("y",0)
    .attr("fill","#c9a227").attr("opacity",0).attr("pointer-events","none");
  const band7  = g.append("rect").attr("height",h).attr("y",0)
    .attr("fill","#e87040").attr("opacity",0).attr("pointer-events","none");

  const dot28 = g.append("circle").attr("r",4).attr("fill","#c9a227").attr("opacity",0);
  const dot7  = g.append("circle").attr("r",4).attr("fill","#e87040").attr("opacity",0);

  const outcomeGroup = g.append("g").attr("pointer-events","none");

  svg.append("rect").attr("width",W).attr("height",H).attr("opacity",0)
    .on("mousemove", (e) => {
      const [mx] = d3.pointer(e);
      const px = mx - margin.left;
      const date = x.invert(px);
      const d28 = rolling28[bisect(rolling28, date, 1)];
      const d7  = rolling7[bisect(rolling7, date, 1)];
      if (!d28) return;

      // Draw window bands
      const x28start = x(new Date(d28.date - 28 * msPerDay));
      const x7start  = x(new Date(d28.date -  7 * msPerDay));
      const xEnd     = x(d28.date);

      band28.attr("opacity", 0.07).attr("x", Math.max(0, x28start)).attr("width", Math.max(0, xEnd - Math.max(0, x28start)));
      band7 .attr("opacity", 0.12).attr("x", Math.max(0, x7start )).attr("width", Math.max(0, xEnd - Math.max(0, x7start)));

      dot28.attr("opacity",1).attr("cx",x(d28.date)).attr("cy",y(d28.rate));
      if (d7) dot7.attr("opacity",1).attr("cx",x(d7.date)).attr("cy",y(d7.rate));

      // Win/loss outcome dots within the 28-day window
      const windowStart = new Date(d28.date - 28 * msPerDay);
      const windowDays = daily.filter(d => d.date >= windowStart && d.date <= d28.date);

      outcomeGroup.selectAll("*").remove();
      windowDays.forEach(day => {
        const cx = x(day.date);
        const losses = day.crimes - day.wins;
        for (let i = 0; i < day.wins; i++) {
          outcomeGroup.append("circle")
            .attr("r", 2.5)
            .attr("cx", cx)
            .attr("cy", y(1.0) + 3 + i * 6)
            .attr("fill", "#4caf50")
            .attr("opacity", 0.55);
        }
        for (let i = 0; i < losses; i++) {
          outcomeGroup.append("circle")
            .attr("r", 2.5)
            .attr("cx", cx)
            .attr("cy", h - 3 - i * 6)
            .attr("fill", "#e05555")
            .attr("opacity", 0.55);
        }
      });

      showTip(
        `<b>${d3.timeFormat("%b %d, %Y")(d28.date)}</b><br>
         28d: ${(d28.rate*100).toFixed(1)}%<br>
         7d: ${d7 ? (d7.rate*100).toFixed(1)+'%' : 'n/a'}`, e);
    })
    .on("mouseout", () => {
      band28.attr("opacity",0); band7.attr("opacity",0);
      dot28.attr("opacity",0);  dot7.attr("opacity",0);
      outcomeGroup.selectAll("*").remove();
      hideTip();
    });

  // Axes
  g.append("g").attr("class","axis").attr("transform",`translate(0,${h})`)
    .call(d3.axisBottom(x).ticks(8).tickFormat(d3.timeFormat("%b '%y")));
  g.append("g").attr("class","axis")
    .call(d3.axisLeft(y).ticks(6).tickFormat(d=>d3.format(".0%")(d)));
})();

// ── 3. Average Revenue by Difficulty ──────────────────────────────────────
(function() {
  const el = document.getElementById("panel-diff-revenue");
  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px">
      <h2 style="margin:0" id="diff-rev-title">Avg Revenue per Crime by Difficulty</h2>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div style="display:flex;gap:4px;font-size:12px">
          <button id="denom-crime" style="background:#0f3460;color:#aaa;border:1px solid #444;border-radius:4px;padding:3px 8px;cursor:pointer">Per Crime</button>
          <button id="denom-win"   style="background:#0f3460;color:#aaa;border:1px solid #444;border-radius:4px;padding:3px 8px;cursor:pointer">Per Win</button>
          <button id="denom-pd"   style="background:#c9a227;color:#1a1a2e;border:none;border-radius:4px;padding:3px 8px;cursor:pointer;font-weight:bold">Per Person-Day</button>
        </div>
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#aaa">
          <span id="rev-label-revenue" style="color:#555">Revenue</span>
          <div id="profit-toggle" style="width:36px;height:18px;background:#0f3460;border:1px solid #4caf50;border-radius:9px;cursor:pointer;position:relative">
            <div id="profit-knob" style="width:14px;height:14px;background:#4caf50;border-radius:50%;position:absolute;top:1px;left:19px;transition:left 0.2s"></div>
          </div>
          <span id="rev-label-profit" style="color:#4caf50;font-weight:bold">Profit</span>
        </div>
      </div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-swatch" style="background:#c9a227"></div>Last 52 weeks</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#4ecdc4"></div>Last 4 weeks</div>
    </div>`;

  const W = el.clientWidth - 32, H = 260;
  const margin = {top:10, right:20, bottom:40, left:70};
  const w = W - margin.left - margin.right;
  const h = H - margin.top - margin.bottom;

  const diffs = difficultyWindows.map(d=>d.difficulty);
  const colors = difficultyPeriodColors;

  const svg = d3.select(el).append("svg").attr("class","chart").attr("width",W).attr("height",H);
  const g = svg.append("g").attr("transform",`translate(${margin.left},${margin.top})`);

  const x0 = d3.scaleBand().domain(diffs).range([0,w]).padding(0.2);
  const x1 = d3.scaleBand().domain(difficultyPeriods).range([0,x0.bandwidth()]).padding(0.05);

  const gridG = g.append("g");
  const yAxis = g.append("g").attr("class","axis");
  g.append("g").attr("class","axis").attr("transform",`translate(0,${h})`)
    .call(d3.axisBottom(x0).tickFormat(d=>`d${d}`));

  let denom = controlState.avgDenom;  // "crime" | "win" | "pd"
  let showProfit = controlState.avgMetric === "profit";

  function getValue(v) {
    if (!v) return 0;
    const base = showProfit ? (v.total - (v.cost || 0)) : v.total;
    if (denom === "win") return v.wins > 0 ? base / v.wins : 0;
    if (denom === "pd")  return v.person_days > 0 ? base / v.person_days : 0;
    return v.count > 0 ? base / v.count : 0;
  }

  function render() {
    const maxVal = d3.max(difficultyWindows, d => d3.max(difficultyPeriods, p => getValue(d[p]))) * 1.1 || 1;
    const y = d3.scaleLinear().domain([0, maxVal]).range([h, 0]);

    gridG.selectAll("line").data(y.ticks(5)).join("line")
      .attr("class","grid-line").attr("x1",0).attr("x2",w)
      .attr("y1",d=>y(d)).attr("y2",d=>y(d));

    yAxis.call(d3.axisLeft(y).ticks(5).tickFormat(fmt$));

    const denomLabel = denom === "win" ? "Win" : denom === "pd" ? "Person-Day" : "Crime";
    document.getElementById("diff-rev-title").textContent =
      `Avg ${showProfit ? "Profit" : "Revenue"} per ${denomLabel} by Difficulty`;

    g.selectAll("rect.bar").data(
      difficultyWindows.flatMap(d => difficultyPeriods.map(p => ({d, period:p, val:getValue(d[p]), v:d[p]})))
    ).join("rect")
      .attr("class","bar")
      .attr("x", ({d,period}) => x0(d.difficulty) + x1(period))
      .attr("y", ({val}) => y(val))
      .attr("width", x1.bandwidth())
      .attr("height", ({val}) => h - y(val))
      .attr("fill", ({period}) => colors[period])
      .attr("opacity", 0.85)
      .on("mouseover", (e, {d, period, val, v}) => showTip(
        `<b>Difficulty ${d.difficulty} — ${difficultyPeriodLabels[period]}</b><br>
         Avg ${showProfit ? "profit" : "revenue"}: ${fmt$(Math.round(val))}<br>
         (${denom === "win" ? "per win" : denom === "pd" ? "per person-day" : "per attempt"})<br>
         Avg cost: ${fmt$(Math.round(v?.count > 0 ? (v.cost||0)/v.count : 0))}<br>
         Person-days: ${Math.round(v?.person_days||0)}<br>
         Crimes: ${v?.count||0} attempted, ${v?.wins||0} won`, e))
      .on("mouseout", hideTip);
  }

  function updateControls() {
    ["crime","win","pd"].forEach(k => {
      const btn = document.getElementById(`denom-${k}`);
      const active = k === denom;
      btn.style.background = active ? "#c9a227" : "#0f3460";
      btn.style.color      = active ? "#1a1a2e" : "#aaa";
      btn.style.border     = active ? "none" : "1px solid #444";
      btn.style.fontWeight = active ? "bold" : "normal";
    });
    profitKnob.style.left = showProfit ? "19px" : "1px";
    lblRev.style.color = showProfit ? "#555" : "#c9a227";
    lblRev.style.fontWeight = showProfit ? "normal" : "bold";
    lblPro.style.color = showProfit ? "#4caf50" : "#555";
    lblPro.style.fontWeight = showProfit ? "bold" : "normal";
  }

  // Per-Crime / Per-Win / Per-Person-Day buttons
  ["crime","win","pd"].forEach(key => {
    document.getElementById(`denom-${key}`).addEventListener("click", () => {
      denom = key;
      controlState.avgDenom = denom;
      syncUrlState();
      updateControls();
      render();
    });
  });

  // Revenue/Profit toggle
  const profitToggle = document.getElementById("profit-toggle");
  const profitKnob   = document.getElementById("profit-knob");
  const lblRev       = document.getElementById("rev-label-revenue");
  const lblPro       = document.getElementById("rev-label-profit");
  profitToggle.addEventListener("click", () => {
    showProfit = !showProfit;
    controlState.avgMetric = showProfit ? "profit" : "revenue";
    syncUrlState();
    updateControls();
    render();
  });

  updateControls();
  render();
})();

// ── 4. Win Rate by Difficulty ──────────────────────────────────────────────
(function() {
  const el = document.getElementById("panel-diff-winrate");
  el.innerHTML = `<h2>Win Rate by Difficulty</h2>
    <div class="legend">
      <div class="legend-item"><div class="legend-swatch" style="background:#c9a227"></div>Last 52 weeks</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#4ecdc4"></div>Last 4 weeks</div>
    </div>`;

  const W = el.clientWidth - 32, H = 280;
  const margin = {top:10, right:20, bottom:40, left:55};
  const w = W - margin.left - margin.right;
  const h = H - margin.top - margin.bottom;

  const diffs = difficultyWindows.map(d=>d.difficulty);
  const x0 = d3.scaleBand().domain(diffs).range([0,w]).padding(0.2);
  const x1 = d3.scaleBand().domain(difficultyPeriods).range([0,x0.bandwidth()]).padding(0.05);
  const y  = d3.scaleLinear().domain([0, 1.05]).range([h,0]);
  const colors = difficultyPeriodColors;

  const svg = d3.select(el).append("svg").attr("class","chart").attr("width",W).attr("height",H);
  const g = svg.append("g").attr("transform",`translate(${margin.left},${margin.top})`);

  g.append("g").selectAll("line").data(y.ticks(5)).join("line")
    .attr("class","grid-line").attr("x1",0).attr("x2",w)
    .attr("y1",d=>y(d)).attr("y2",d=>y(d));

  // 85% line
  g.append("line").attr("stroke","#ff6b6b").attr("stroke-width",1).attr("stroke-dasharray","4,4").attr("opacity",0.6)
    .attr("x1",0).attr("x2",w).attr("y1",y(0.85)).attr("y2",y(0.85));
  g.append("text").attr("fill","#ff6b6b").attr("font-size",10).attr("opacity",0.8)
    .attr("x",4).attr("y",y(0.85)-4).text("85%");

  difficultyWindows.forEach(d => {
    difficultyPeriods.forEach(period => {
      const v = d[period];
      if (!v || v.count === 0) return;
      const rate = v.wins / v.count;
      g.append("rect")
        .attr("x", x0(d.difficulty) + x1(period))
        .attr("y", y(rate))
        .attr("width", x1.bandwidth())
        .attr("height", h - y(rate))
        .attr("fill", colors[period])
        .attr("opacity", 0.85)
        .on("mouseover", (e) => showTip(
          `<b>Difficulty ${d.difficulty} — ${difficultyPeriodLabels[period]}</b><br>
           Win rate: ${(rate*100).toFixed(1)}%<br>
           ${v.wins}W / ${v.count - v.wins}L of ${v.count}`, e))
        .on("mouseout", hideTip);
    });
  });

  g.append("g").attr("class","axis").attr("transform",`translate(0,${h})`)
    .call(d3.axisBottom(x0).tickFormat(d=>`d${d}`));
  g.append("g").attr("class","axis")
    .call(d3.axisLeft(y).ticks(5).tickFormat(d=>d3.format(".0%")(d)));
})();

// ── 5. Total Revenue by Difficulty ────────────────────────────────────────
(function() {
  const el = document.getElementById("panel-diff-total");
  el.innerHTML = `<h2>Total Revenue by Difficulty</h2>
    <div class="legend">
      <div class="legend-item"><div class="legend-swatch" style="background:#c9a227"></div>Profit</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#c0392b;opacity:0.8"></div>Cost</div>
    </div>`;

  const W = el.clientWidth - 32, H = 260;
  const margin = {top:10, right:20, bottom:40, left:80};
  const w = W - margin.left - margin.right;
  const h = H - margin.top - margin.bottom;

  const diffs = difficultyWindows.map(d=>d.difficulty);
  const totals = difficultyWindows.map(d => d.total.total || 0);
  const costs = difficultyWindows.map(d => d.total.cost || 0);
  const maxTotal = d3.max(totals);

  const x = d3.scaleBand().domain(diffs).range([0,w]).padding(0.2);
  const y = d3.scaleLinear().domain([0, maxTotal * 1.1]).range([h,0]);

  const svg = d3.select(el).append("svg").attr("class","chart").attr("width",W).attr("height",H);
  const g = svg.append("g").attr("transform",`translate(${margin.left},${margin.top})`);

  g.append("g").selectAll("line").data(y.ticks(5)).join("line")
    .attr("class","grid-line").attr("x1",0).attr("x2",w)
    .attr("y1",d=>y(d)).attr("y2",d=>y(d));

  difficultyWindows.forEach((d, i) => {
    const total  = totals[i];
    const cost   = costs[i];
    const profit = total - cost;
    const count  = d.total.count || 0;
    const wins   = d.total.wins || 0;
    if (!total) return;

    const tip = (e) => showTip(
      `<b>Difficulty ${d.difficulty}</b><br>
       Revenue: ${fmt$(total)}<br>
       Cost: ${fmt$(cost)}<br>
       Profit: ${fmt$(profit)}<br>
       Crimes: ${count} (${wins} wins)`, e);

    // Profit portion (bottom)
    g.append("rect")
      .attr("x", x(d.difficulty)).attr("width", x.bandwidth())
      .attr("y", y(profit)).attr("height", h - y(profit))
      .attr("fill", "#c9a227").attr("opacity", 0.85)
      .on("mouseover", tip).on("mouseout", hideTip);

    // Cost portion (top, stacked)
    if (cost > 0) {
      g.append("rect")
        .attr("x", x(d.difficulty)).attr("width", x.bandwidth())
        .attr("y", y(total)).attr("height", y(profit) - y(total))
        .attr("fill", "#c0392b").attr("opacity", 0.8)
        .on("mouseover", tip).on("mouseout", hideTip);
    }
  });

  g.append("g").attr("class","axis").attr("transform",`translate(0,${h})`)
    .call(d3.axisBottom(x).tickFormat(d=>`d${d}`));
  g.append("g").attr("class","axis")
    .call(d3.axisLeft(y).ticks(5).tickFormat(fmt$));
})();

// ── Deep links ─────────────────────────────────────────────────────────────
// Inject a link icon into each panel; clicking copies the URL and updates hash.
document.querySelectorAll(".panel[id]").forEach(panel => {
  const h2 = panel.querySelector("h2");
  if (!h2) return;
  const a = document.createElement("a");
  a.className = "deep-link";
  a.href = `#${panel.id}`;
  a.title = "Copy link to this chart";
  a.textContent = "🔗";
  a.addEventListener("click", e => {
    e.preventDefault();
    setHash(`#${panel.id}`);
    const url = location.href;
    navigator.clipboard.writeText(url).then(() => {
      a.classList.add("copied");
      setTimeout(() => a.classList.remove("copied"), 1500);
    });
  });
  h2.prepend(a);  // prepend so float:right pulls it to the right of the title
});

// Scroll to hash on load
if (location.hash) {
  const target = document.querySelector(location.hash);
  if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
}
</script>
