---
# GENERATED FILE -- DO NOT EDIT.
# Rendered from deploy/capture.py by deploy/render-configmap.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: torn-market-capture-script
  namespace: default
  labels:
    app: torn-market-capture
data:
  capture.py: |
    #!/usr/bin/env python3
    """Snapshot the item market for a handful of items, one JSON line per item.

    Runs both in-cluster (as the torn-market-capture CronJob, every 30 min) and
    locally against the repo. The k8s ConfigMap is *generated* from this file by
    render-configmap.sh -- edit here, never in configmap.yaml.

    Items are appended to prices.jsonl rather than overwritten: the whole point is
    the price series over time, so every run is a new row and nothing is ever
    rewritten.
    """
    import json
    import os
    import ssl
    import sys
    import time
    import urllib.request
    import urllib.error
    from datetime import datetime, timezone
    from pathlib import Path

    try:
        import certifi
        _ssl_ctx = ssl.create_default_context(cafile=certifi.where())
    except ImportError:
        # Fall back to well-known system cert locations
        _ssl_ctx = ssl.create_default_context()
        for cafile in ['/etc/ssl/cert.pem', '/etc/ssl/certs/ca-certificates.crt']:
            if os.path.exists(cafile):
                _ssl_ctx.load_verify_locations(cafile=cafile)
                break

    # In-cluster the CronJob sets both of these (/app, /data). Locally they default
    # to the repo this file lives in, so the script works from a fresh clone without
    # a hardcoded home directory.
    REPO_ROOT = Path(__file__).resolve().parent.parent
    APP_DIR = Path(os.environ.get('APP_DIR', REPO_ROOT))
    OUTPUT_DIR = Path(os.environ.get('OUTPUT_DIR', APP_DIR / 'data/market-snapshots'))
    LOG_FILE = OUTPUT_DIR / 'capture.log'
    DATA_FILE = OUTPUT_DIR / 'prices.jsonl'

    # Items to snapshot. Spaced by SLEEP_BETWEEN seconds so a run never looks like
    # a burst to Torn's rate limiter.
    ITEMS = [
        (552, 'Bottle of Mistletoe Madness'),
        (541, 'Bottle of Stinky Swamp Punch'),
    ]
    SLEEP_BETWEEN = 5

    TS = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')


    def log(msg):
        OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
        with open(LOG_FILE, 'a') as f:
            f.write(f'[{TS}] {msg}\n')


    def load_api_key():
        key = os.environ.get('TORN_API_KEY')
        if key:
            return key
        env_file = APP_DIR / '.env'
        if env_file.exists():
            for line in env_file.read_text().splitlines():
                if line.startswith('TORN_API_KEY='):
                    return line.split('=', 1)[1].strip()
        return None


    def fetch_item(item_id, api_key):
        url = f'https://api.torn.com/v2/market/{item_id}/itemmarket'
        req = urllib.request.Request(url, headers={
            'Authorization': f'ApiKey {api_key}',
            'User-Agent': 'Mozilla/5.0',
        })
        try:
            with urllib.request.urlopen(req, timeout=30, context=_ssl_ctx) as resp:
                data = json.loads(resp.read())
        except urllib.error.HTTPError as e:
            body = e.read()
            data = json.loads(body) if body else {'error': {'code': e.code, 'error': e.reason}}

        error = data.get('error', {}) or {}
        if error.get('code') == 5:
            log(f'item {item_id} rate limited, skipping')
            return False
        if 'error' in data:
            log(f'item {item_id} error: {error}')
            return False

        with open(DATA_FILE, 'a') as f:
            f.write(json.dumps({'timestamp': TS, 'item_id': item_id, 'data': data}) + '\n')
        log(f'item {item_id} OK')
        return True


    api_key = load_api_key()
    if not api_key:
        log('ERROR: no API key found')
        sys.exit(1)

    for n, (item_id, _name) in enumerate(ITEMS):
        if n:
            time.sleep(SLEEP_BETWEEN)
        fetch_item(item_id, api_key)
