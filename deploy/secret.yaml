---
apiVersion: v1
kind: Secret
metadata:
  name: torn-market-capture-secrets
  namespace: default
  labels:
    app: torn-market-capture
type: Opaque
data:
  # Base64-encoded .env file containing TORN_API_KEY=<key>
  # To create: cat .env | base64 -w 0
  .env: "your_base64_encoded_env_content_here"

---
# To create from file directly:
# kubectl create secret generic torn-market-capture-secrets \
#   --from-file=.env \
#   --dry-run=client -o yaml > deploy/secret.yaml
