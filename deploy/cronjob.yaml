---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: torn-market-capture
  namespace: default
  labels:
    app: torn-market-capture
spec:
  schedule: "3,33 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: torn-market-capture
              image: ghcr.io/matthewnuckolls/torn-dynamic-cli:latest
              imagePullPolicy: Always
              env:
                - name: APP_DIR
                  value: /app
                - name: OUTPUT_DIR
                  value: /data
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: env-file
                  mountPath: /app/.env
                  subPath: .env
                  readOnly: true
                - name: data
                  mountPath: /data
          volumes:
            - name: env-file
              secret:
                secretName: torn-market-capture-secrets
                items:
                  - key: .env
                    path: .env
            - name: data
              persistentVolumeClaim:
                claimName: torn-market-capture-data
          imagePullSecrets:
            - name: ghcr-cred
          securityContext:
            fsGroup: 65532
