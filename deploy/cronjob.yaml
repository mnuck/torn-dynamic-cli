---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: torn-market-capture
  namespace: default
  labels:
    app: torn-market-capture
spec:
  schedule: "3,33 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Never retry a failed run. capture.py exits non-zero on a dead key or an
      # empty run so the Job shows Failed; the default backoffLimit (6) would
      # turn that into a retry storm against a shared key. The next scheduled
      # run is 30 minutes out anyway.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: torn-market-capture
              image: python:3-alpine
              command: ["python3", "/scripts/capture.py"]
              env:
                - name: OUTPUT_DIR
                  value: /data
                - name: TORN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: torn-market-capture-secrets
                      key: TORN_API_KEY
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: data
                  mountPath: /data
          volumes:
            - name: scripts
              configMap:
                name: torn-market-capture-script
            - name: data
              persistentVolumeClaim:
                claimName: torn-market-capture-data
          securityContext:
            fsGroup: 65532
